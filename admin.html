<!DOCTYPE html>

<head>

<style>
:root{--bg:#F8FAFC;--sky:#E0F2FE;--blue:#3B82F6;--blueh:#2563EB;--ink:#1E293B;--mute:#64748B;--line:#DBEAFE;--r:12px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
small{color:var(--mute);display:block;font-size:12.5px}
:focus-visible{outline:3px solid var(--blueh);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.logo{font-family:"Playfair Display",serif;font-weight:700;font-size:24px}
.logo span{color:var(--blue)}
.logo em{font-family:"Plus Jakarta Sans",sans-serif;font-style:normal;font-size:12px;font-weight:700;background:#fff;color:var(--blueh);border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:middle}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:var(--r);padding:10px 18px;font-weight:600;transition:background .2s,transform .15s}
.btn:hover{background:var(--blueh);border-color:var(--blueh)}
.btn:active{transform:scale(.97)}
.btn.o{background:#fff;color:var(--blueh);border-color:#BFDBFE}
.btn.o:hover{background:var(--sky)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.red{background:#fff;color:#B91C1C;border-color:#FECACA}
.btn.red:hover{background:#FEE2E2}
.btn.g{background:#16A34A;border-color:#16A34A}
.btn.g:hover{background:#15803D}
.btn.full{width:100%}
.lk{color:var(--blueh);font-weight:600;font-size:14px}
.lk:hover{text-decoration:underline}
/* login */
.login{position:fixed;inset:0;z-index:300;background:linear-gradient(160deg,var(--sky),var(--bg));display:none;align-items:center;justify-content:center;padding:20px}
.login.on{display:flex}
.lcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px 30px;width:100%;max-width:400px;display:grid;gap:14px;box-shadow:0 30px 60px -36px rgba(37,99,235,.5);text-align:center}
.lcard p{margin:0;color:var(--mute)}
.lcard form{display:grid;gap:12px;text-align:left}
.lcard label{font-weight:600;font-size:13.5px;display:grid;gap:5px}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=number],input[type=url],select,textarea{width:100%;padding:10px 13px;border:1px solid #BFDBFE;border-radius:var(--r);background:#fff;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.err{color:#B91C1C;font-size:13px;min-height:18px}
.hint{font-size:12.5px;color:var(--mute)}
/* layout */
.app{display:none}
.app.on{display:block}
.sb{position:fixed;inset:0 auto 0 0;width:250px;background:var(--sky);padding:22px 14px;display:flex;flex-direction:column;gap:6px;z-index:60;transition:transform .25s}
.sb .logo{padding:0 10px 18px}
.nv{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;border-radius:var(--r);padding:11px 12px;font-weight:600;color:#334155;text-align:left;transition:.2s}
.nv:hover{background:rgba(255,255,255,.7)}
.nv.on{background:var(--blue);color:#fff}
.nv .cnt{margin-left:auto;background:#FACC15;color:#713F12;border-radius:99px;font-size:12px;padding:0 8px;min-width:22px;text-align:center}
.nv.on .cnt{background:#fff;color:var(--blueh)}
.sb .sp{flex:1}
.main{margin-left:250px;min-width:0}
.top{position:sticky;top:0;z-index:40;background:rgba(248,250,252,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px}
.top h1{font-family:"Playfair Display",serif;font-size:22px;margin:0;font-weight:700;white-space:nowrap}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:var(--r);width:40px;height:40px;place-items:center}
.sbox{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 14px;width:min(340px,100%);color:var(--mute)}

.prof{position:relative}
.av{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px 4px 4px;font-weight:600}

.dd{position:absolute;right:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;min-width:210px;display:none;box-shadow:0 20px 40px -20px rgba(15,23,42,.3)}
.dd.on{display:block}
.dd button,.dd a{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:9px 11px;border-radius:9px;text-align:left}
.dd button:hover,.dd a:hover{background:var(--sky)}
.cont{padding:28px}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55;display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.ph h2{font-family:"Playfair Display",serif;font-size:30px;margin:0;line-height:1.15}
.ph p{margin:4px 0 0;color:var(--mute)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.card h3{margin:0 0 14px;font-size:17px}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{text-align:left;display:grid;gap:2px;transition:transform .2s,box-shadow .2s}

table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid #EEF4FB;vertical-align:middle}

.acts{display:flex;gap:6px;flex-wrap:wrap}

.empty{text-align:center;color:var(--mute);padding:34px 10px}
.bar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;transition:.2s}

.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab em{font-style:normal;opacity:.7;margin-left:4px}
.soon{display:grid;gap:10px}
.sn{display:flex;gap:12px;align-items:center;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;text-align:left;transition:.2s}

.sn .d{width:48px;height:52px;border-radius:12px;background:var(--sky);color:var(--blueh);display:grid;place-items:center;text-align:center;line-height:1.1;font-weight:700;flex:none}
.sn .d small{color:var(--blueh);font-size:11px;text-transform:uppercase}
.sn .d b{font-size:19px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;font-size:12px;font-weight:700;color:var(--mute);padding:4px 0}
.cd{min-height:62px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:6px;text-align:left;transition:.2s;display:flex;flex-direction:column;justify-content:space-between}

.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--mute)}
.leg span{display:flex;gap:6px;align-items:center}
/* portfolio & packages */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.pc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pi{position:relative;aspect-ratio:4/3;background:var(--sky)}
.pi img{width:100%;height:100%;object-fit:cover;display:block}
.tp{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px}
.tp.v{background:var(--blue);color:#fff}
.pb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px}
.pb b{display:block;font-size:14px;line-height:1.3}
.pks{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pk{display:flex;flex-direction:column}
.pk.pop{border:2px solid var(--blue)}
.pk h3{font-family:"Playfair Display",serif;font-size:22px;margin:0}
.pk p{margin:4px 0 0;color:var(--mute)}
.pk .pr{font-family:"Playfair Display",serif;font-size:28px;font-weight:700;margin:12px 0}
.pk ul{list-style:none;margin:0 0 16px;padding:0;flex:1}
.pk li{padding:5px 0 5px 24px;position:relative;color:#334155}
.pk li::before{content:"✓";position:absolute;left:0;color:var(--blueh);font-weight:700}
.pk .mt{color:var(--mute);font-size:13px;margin-bottom:12px}
/* modal */
.modal{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:22px;width:100%;max-width:620px;padding:28px;margin:auto;position:relative;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.mx{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--sky);font-size:20px;line-height:1}
.mbox h3{font-family:"Playfair Display",serif;font-size:24px;margin:0 0 6px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-right:42px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:16px 0}
.g2 b{display:block;overflow-wrap:anywhere}
.sum{background:var(--sky);border-radius:14px;padding:6px 16px;margin-bottom:14px}
.sum div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #BFDBFE}
.sum div:last-child{border:0}
.slip{border:1px dashed #93C5FD;border-radius:14px;padding:14px 16px;background:#F8FBFF;margin-bottom:6px}
.slip .t{color:#15803D;font-weight:700}
.slip b.n{font-family:"Playfair Display",serif;font-size:26px;display:block}
.slip dl{margin:8px 0 0;font-size:13px}
.slip dl div{display:flex;justify-content:space-between;padding:2px 0}
.slip dt{color:var(--mute)}.slip dd{margin:0;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.fr{display:grid;gap:5px;margin-top:12px;font-weight:600;font-size:13.5px}
.fr .em{display:none;color:#B91C1C;font-weight:500;font-size:12.5px}
.fr.bad .em{display:block}
.fr.bad input,.fr.bad select,.fr.bad textarea{border-color:#DC2626}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toasts{position:fixed;right:20px;bottom:20px;z-index:400;display:grid;gap:8px;max-width:min(380px,92vw)}
.ts{background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:flex-start;animation:pop .25s ease;box-shadow:0 14px 30px -14px rgba(15,23,42,.5)}
.ts::before{content:"✓";background:#22C55E;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px;flex:none}
.ts.e::before{content:"!";background:#EF4444}
@media(max-width:1100px){.kg{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.pks{grid-template-columns:1fr}}
@media(max-width:900px){
 .sb{transform:translateX(-100%)}
 .sb.on{transform:none}
 .scrim.on{display:block}
 .main{margin-left:0}
 .burger{display:grid}
 .top{padding:10px 16px}.cont{padding:18px 16px}
 .top h1{font-size:18px}
 .av span{display:none}.av{padding:4px}
}
@media(max-width:560px){.kg{grid-template-columns:1fr}.g2,.f2{grid-template-columns:1fr}.top h1{display:none}.sbox{margin-left:0}.cd{min-height:50px;padding:4px}.mbox{padding:22px 18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function detail(c){
 const b=get(c);if(!b)return;
 const wa=`https://wa.me/${b.wa}?text=${encodeURIComponent(`Halo ${b.nm}, kami dari Terekam Studio. Terkait booking #${b.code} (${b.pkg}) pada ${fD(b.dt,{day:"numeric",month:"long",year:"numeric"})}, ${b.status==="menunggu"?"kami sedang memverifikasi pembayaranmu.":b.status==="terjadwal"?"jadwalmu sudah terkunci. Sampai jumpa di sesi foto!":b.status==="selesai"?"sesi sudah selesai. File akan segera kami kirim.":"booking ini sudah dibatalkan."}`)}`;
 const proof=b.proof?`<div class="slip"><div class="t">✓ Transfer Berhasil (simulasi)</div><b class="n">${rp(b.paid)}</b><dl><div><dt>Dari</dt><dd>${esc(b.nm)}</dd></div><div><dt>Ke</dt><dd>Terekam Studio</dd></div><div><dt>No. Referensi</dt><dd>TRX${esc(b.code.replace(/\D/g,""))}</dd></div><div><dt>File</dt><dd>${esc(b.proof)}</dd></div></dl></div>`:`<div class="slip"><small>Belum ada bukti transfer (booking manual dari admin).</small></div>`;
 openM(`<div class="mh"><div><small>Kode Booking</small><h3>#${esc(b.code)}</h3></div>${badge(b.status)}</div>
 <div class="g2"><div><small>Klien</small><b>${esc(b.nm)}</b></div><div><small>WhatsApp</small><b>+${esc(b.wa)}</b></div><div><small>Instagram</small><b>${esc(b.ig||"-")}</b></div><div><small>Paket</small><b>${esc(b.pkg)}</b></div><div><small>Add-on</small><b>${esc(b.aos&&b.aos.length?b.aos.join(", "):"-")}</b></div><div><small>Tanggal</small><b>${fD(b.dt,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</b></div><div><small>Sesi</small><b>${esc(b.tm)}</b></div><div><small>Lokasi</small><b>${esc(b.lc)}</b></div></div>
 <div class="sum"><div><span>Total biaya</span><b>${rp(b.total)}</b></div><div><span>Dibayar (${b.py==="dp"?"DP 50%":"Lunas"})</span><b>${rp(b.paid)}</b></div><div><span>Sisa pembayaran</span><b>${rp(b.total-b.paid)}</b></div></div>
 <small style="margin-bottom:6px">Bukti transfer</small>${proof}
 <div class="row">
  ${b.status==="menunggu"?`<button class="btn" data-act="accept">Terima &amp; Kunci Jadwal</button>`:""}
  ${b.py==="dp"&&b.status!=="batal"?`<button class="btn o" data-act="paid">Tandai Lunas</button>`:""}
  ${b.status==="terjadwal"?`<button class="btn" data-act="done">Tandai Selesai</button>`:""}
  ${b.status==="menunggu"||b.status==="terjadwal"?`<button class="btn red" data-act="cancel">Batalkan</button>`:""}
  <a class="btn g" href="${wa}" target="_blank" rel="noopener">Hubungi Klien via WA</a>
  <button class="btn red" data-act="askdel" data-c="${esc(b.code)}">${ic("trash")} Hapus</button>
 </div>`);
 $("#mbody").dataset.c=c;
}
function upd(c,fn,msg){
 const b=get(c);if(!b)return;
 const r=fn(b);if(r===false)return;
 if(!save())return;
 toast(msg);render();
 if($("#modal").classList.contains("on")&&$("#mbody").dataset.c===c)detail(c);
}
function accept(c){
 upd(c,b=>{
  const cf=DB.bookings.find(x=>x.code!==c&&x.status==="terjadwal"&&x.dt===b.dt&&x.tm===b.tm);
  if(cf){toast(`Jadwal bentrok dengan #${cf.code} (${cf.nm}) di sesi yang sama`,"e");return false}
  b.status="terjadwal";
 },`Pembayaran #${c} diverifikasi, jadwal dikunci`);
}

function pkForm(id){
 const p=DB.packages.find(x=>x.id===id);if(!p)return;
 openM(`<h3>Edit Paket</h3>
 <form data-form="pkg" data-id="${esc(id)}" novalidate>
 ${fr("kn","Nama Paket",`<input id="kn" type="text" value="${esc(p.name)}">`,"Nama wajib diisi.")}
 ${fr("kp","Harga (Rp)",`<input id="kp" type="number" min="1000" step="1000" value="${p.price}">`,"Harga minimal Rp 1.000.")}
 ${fr("kd","Deskripsi singkat",`<input id="kd" type="text" value="${esc(p.desc)}">`,"")}
 ${fr("kf","Fasilitas (satu per baris)",`<textarea id="kf" rows="6">${esc(p.features.join("\n"))}</textarea>`,"Isi minimal satu fasilitas.")}
 <div class="row"><button class="btn o" type="button" data-act="closem">Batal</button><button class="btn" type="submit">Simpan Perubahan</button></div></form>`);
}
function readFile(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.75))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)})}
const bad=(id,c)=>{$("#"+id).closest(".fr").classList.toggle("bad",c);return c};

document.addEventListener("submit",async e=>{
 const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
 const k=f.dataset.form;
 if(k==="login"){
  if($("#le").value.trim().toLowerCase()==="admin@terekam.web.id"&&$("#lp").value==="admin123"){enter()}
  else{$("#lerr").textContent="Email atau password salah."}
 }else if(k==="book"){
  const nm=$("#fn").value.trim(),wa=$("#fw").value.replace(/[\s\-().+]/g,""),dt=$("#fd").value,lc=$("#fl").value.trim();
  const er=[bad("fn",nm.length<3),bad("fw",!/^(62|0)8\d{7,11}$/.test(wa)),bad("fd",!dt||dt<addD(0)),bad("fl",lc.length<3)];
  if(er.includes(true))return;
  const p=DB.packages.find(x=>x.id===$("#fp").value),py=$("#fy").value,st=$("#fs").value,tm=$("#ft").value;
  if(st==="terjadwal"){const cf=DB.bookings.find(x=>x.status==="terjadwal"&&x.dt===dt&&x.tm===tm);if(cf){toast(`Jadwal bentrok dengan #${cf.code} (${cf.nm})`,"e");return}}
  const code=newCode();
  DB.bookings.unshift({code,nm,wa:wa.replace(/^0/,"62"),ig:"",pkgKey:p.id,pkg:p.name,aos:[],total:p.price,paid:py==="dp"?p.price/2:p.price,py,dt,tm,lc,status:st,proof:"",created:new Date().toISOString(),src:"admin"});
  if(!save())return;closeM();toast(`Booking #${code} berhasil ditambahkan`);S.bf="all";S.q="";$("#gq").value="";go("booking");
 }else if(k==="photo"){
  const t=$("#pt").value.trim(),u=$("#pu").value.trim(),file=$("#pf").files[0],vid=$("#pv").value==="1",d=+$("#pd").value;
  const er=[bad("pt",t.length<3),bad("pd",vid&&!(d>=5&&d<=600)),bad("pu",u!==""&&!/^https?:\/\/\S+$/i.test(u)),bad("pf",!u&&!file)];
  if(er.includes(true))return;
  let img=u;
  if(!u&&file){img=await readFile(file);if(!img){toast("File gambar tidak bisa dibaca","e");return}}
  DB.portfolio.unshift({id:"p"+Date.now(),t,c:$("#pc").value,v:vid?1:0,d:vid?d:0,i:img});
  if(!save()){DB.portfolio.shift();return}
  closeM();toast(`"${t}" ditambahkan ke portofolio`);render();
 }else if(k==="pkg"){
  const p=DB.packages.find(x=>x.id===f.dataset.id),nm=$("#kn").value.trim(),pr=+$("#kp").value,ft=$("#kf").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const er=[bad("kn",!nm),bad("kp",!(pr>=1000)),bad("kf",!ft.length)];
  if(er.includes(true))return;
  p.name=nm;p.price=pr;p.desc=$("#kd").value.trim();p.features=ft;
  if(!save())return;closeM();toast(`Paket "${nm}" berhasil diperbarui`);render();
 }
});

/* ---------- Clicks ---------- */
document.addEventListener("click",e=>{
 const cl=e.target.closest("a.cl");if(cl){e.preventDefault();window.open(CLIENT,"_blank");return}
 const t=e.target.closest("[data-act]");
 if(!e.target.closest(".prof"))$("#dd").classList.remove("on");
 if(e.target.id==="modal")closeM();
 if(!t)return;
 const a=t.dataset.act,c=t.dataset.c,cur=$("#mbody").dataset.c;
 switch(a){
  case"nav":go(t.dataset.v);break;
  case"goto":go(t.dataset.v,t.dataset.f);break;
  case"menu":$("#sb").classList.toggle("on");$("#scrim").classList.toggle("on");break;
  case"profile":$("#dd").classList.toggle("on");e.stopPropagation();break;
  case"quick":enter();break;
  case"logout":localStorage.removeItem(AUTH);$("#app").classList.remove("on");$("#login").classList.add("on");$("#dd").classList.remove("on");$("#sb").classList.remove("on");$("#scrim").classList.remove("on");$("#lerr").textContent="";toast("Anda telah keluar dari dashboard");break;
  case"reset":ask("Reset data demo?","Semua booking, portofolio, dan paket kembali ke data awal. Booking dari website klien juga ikut terhapus.","Reset Data",()=>{localStorage.removeItem(KEY);init();closeM();toast("Data demo dikembalikan ke awal");render()});break;
  case"closem":closeM();break;
  case"confirmok":{const f=confirmCb;if(f)f()}break;
  case"tab":S.bf=t.dataset.f;fillBook();break;
  case"detail":detail(c);break;
  case"verify":accept(c);break;
  case"accept":accept(cur);break;
  case"paid":upd(cur,b=>{b.py="full";b.paid=b.total},`Pembayaran #${cur} ditandai Lunas`);break;
  case"done":upd(cur,b=>{b.status="selesai"},`Sesi #${cur} ditandai selesai`);break;
  case"cancel":{const k=cur;ask("Batalkan booking?",`Booking #${k} akan ditandai Dibatalkan dan jadwalnya dilepas.`,"Ya, Batalkan",()=>{closeM();upd(k,b=>{b.status="batal"},`Booking #${k} dibatalkan`)})}break;
  case"askdel":{const k=c;ask("Hapus booking?",`Booking #${k} akan dihapus permanen dari daftar.`,"Hapus",()=>{DB.bookings=DB.bookings.filter(b=>b.code!==k);if(save()){closeM();toast(`Booking #${k} dihapus`);render()}})}break;
  case"newbook":bookForm();break;
  case"calprev":{const s=S.cal;s.m--;if(s.m<0){s.m=11;s.y--}render()}break;
  case"calnext":{const s=S.cal;s.m++;if(s.m>11){s.m=0;s.y++}render()}break;
  case"caltoday":{const n=new Date();S.cal={y:n.getFullYear(),m:n.getMonth(),sel:addD(0)};render()}break;
  case"calsel":S.cal.sel=t.dataset.d;render();break;
  case"pfilter":S.pf=t.dataset.f;render();break;
  case"padd":photoForm();break;
  case"pdel":{const p=DB.portfolio.find(x=>x.id===t.dataset.id);if(p)ask("Hapus dari portofolio?",`"${esc(p.t)}" akan hilang dari galeri website klien.`,"Hapus",()=>{DB.portfolio=DB.portfolio.filter(x=>x.id!==p.id);if(save()){closeM();toast(`"${p.t}" dihapus dari portofolio`);render()}})}break;
  case"pkedit":pkForm(t.dataset.id);break;
 }
});
document.addEventListener("input",e=>{
 if(e.target.id==="gq"){S.q=e.target.value;if(S.view!=="booking"){S.bf="all";go("booking");$("#gq").focus()}else fillBook();const b=$("#bq");if(b)b.value=S.q}
 else if(e.target.id==="bq"){S.q=e.target.value;$("#gq").value=S.q;fillBook()}
});
document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"&&i.hasAttribute("data-fb")&&!i.dataset.done){i.dataset.done=1;i.src=PH}},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#modal").classList.contains("on"))closeM();$("#sb").classList.remove("on");$("#scrim").classList.remove("on");$("#dd").classList.remove("on")}});

/* ---------- Sync dengan website klien ---------- */
function sync(){
 const old=new Set(DB.bookings.map(b=>b.code));
 const fresh=load();
 if(!fresh.bookings)return;
 DB=Object.assign(DB,fresh);
 const nb=DB.bookings.filter(b=>!old.has(b.code));
 nb.forEach(b=>toast(`Booking baru masuk: #${b.code} · ${b.nm}`));
 render();
}
window.addEventListener("storage",e=>{if(e.key===KEY&&localStorage.getItem(AUTH)==="1")sync()});
if(bc)bc.onmessage=()=>{if(localStorage.getItem(AUTH)==="1")sync()};

/* Jembatan postMessage: booking dari website klien yang dibuka lewat tombol "Lihat Website Klien" */
window.addEventListener("message",e=>{
 const d=e.data;if(!d||d.terekam!=="booking"||!d.b||typeof d.b.code!=="string")return;
 const b=d.b;if(!/^\d{4}-\d{2}-\d{2}$/.test(String(b.dt)))return;
 const f=load();if(f.bookings)DB.bookings=f.bookings;
 if(get(b.code))return;
 DB.bookings.unshift({code:String(b.code),nm:String(b.nm||""),wa:String(b.wa||""),ig:String(b.ig||""),pkgKey:String(b.pkgKey||""),pkg:String(b.pkg||""),aos:Array.isArray(b.aos)?b.aos.map(String):[],total:+b.total||0,paid:+b.paid||0,py:b.py==="full"?"full":"dp",dt:String(b.dt),tm:String(b.tm||""),lc:String(b.lc||""),status:"menunggu",proof:String(b.proof||""),created:String(b.created||new Date().toISOString()),src:"web"});
 if(save()){toast(`Booking baru masuk: #${b.code} · ${b.nm}`);render()}
});

/* ---------- Start ---------- */
function enter(){
 localStorage.setItem(AUTH,"1");
 $("#login").classList.remove("on");$("#app").classList.add("on");
 init();render();toast("Selamat datang, Admin Raka");
}
$("#burger").innerHTML=ic("menu");
$("#sbox").insertAdjacentHTML("afterbegin",ic("search"));
$("#siteLink").innerHTML=ic("ext")+"Lihat Website Klien";
$("#outBtn").innerHTML=ic("out")+"Keluar";
$("#ddSite").innerHTML=ic("ext")+"Lihat Website Klien";
$("#ddReset").innerHTML=ic("reset")+"Reset Data Demo";
$("#ddOut").innerHTML=ic("out")+"Keluar";
init();
if(localStorage.getItem(AUTH)==="1"){$("#login").classList.remove("on");$("#app").classList.add("on");render()}
})();
